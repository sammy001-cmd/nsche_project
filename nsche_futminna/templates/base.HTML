{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NSChE FUTMINNA{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="{% static 'img/nchey.jpg' %} " class="me-2 rounded-circle" type="image/x-icon">


  <!-- Animate.css for smooth fades -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Custom Site CSS -->
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% block head_extra %}{% endblock %}
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
  <img src="{% static 'img/nchey.jpg' %}" alt="Logo" class="me-2 rounded-circle " style="height: 40px;"/>
  <span>NSChE FUTMINNA</span>
</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'about' %}">About</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'events_list' %}">Events</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="{% url 'contact' %}">Contact</a></li>

          <li class="nav-item ms-2"><a class="btn btn-outline-light" href="{% url 'login' %}">Login</a></li>
          <br>
          <li class="nav-item ms-2"><a class="btn btn-light text-success" href="{% url 'register' %}">Signup</a></li>
        
      </ul>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 container my-5">
  {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="bg-success text-white mt-auto py-4">
  <div class="container text-center small">
    &copy; {% now "Y" %} NSChE FUTMINNA | Powered by <span class="fw-semibold">React-360 Agenda</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
