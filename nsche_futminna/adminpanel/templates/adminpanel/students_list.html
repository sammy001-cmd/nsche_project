{% extends "adminpanel/base_admin.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>All Students</h2>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle shadow-sm">
        <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th class="d-none d-sm-table-cell">Email</th>
                <th class="d-none d-md-table-cell">phone number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.user.get_full_name }}</td>
                <td class="d-none d-sm-table-cell">{{ student.user.email }}</td>
                <td class="d-none d-md-table-cell">{{ student.phone }}</td>
                <td>
                    <a href="{% url 'student_detail' student.pk %}" class="btn btn-sm btn-info">View</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No students yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
