{% extends "adminpanel/base_admin.html" %}
{% block content %}


    <h2 class="mb-4">Manage Events</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
            <tr>
                <td>{{ event.id }}</td>
                <td>{{ event.title }}</td>
                <td>{{ event.date }}</td>
                <td>{{ event.description|truncatewords:12 }}</td>
                <td>
                    <a href="{% url 'admin_edit_event' event.id %}" class="btn btn-sm btn-primary">Edit</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No events available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
