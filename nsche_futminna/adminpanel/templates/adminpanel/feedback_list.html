{% extends "adminpanel/base.html" %}
{% block content %}
<h2>Feedback / Contact Messages</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Message</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody>
    {% for fb in feedbacks %}
    <tr>
      <td>{{ fb.name }}</td>
      <td>{{ fb.email }}</td>
      <td>{{ fb.message }}</td>
      <td>{{ fb.created_at|date:"Y-m-d H:i" }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No feedback yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
