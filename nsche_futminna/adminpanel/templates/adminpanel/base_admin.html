<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* Base layout */
        body {
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #0d6efd;
            color: #fff;
            transition: all 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1030;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .sidebar h4 {
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        /* Content area */
        .main-content {
            margin-left: 250px;
            padding: 2rem;
            transition: margin-left 0.3s ease;
        }

        .main-content.collapsed {
            margin-left: 0;
        }

        /* Navbar for mobile */
        .top-nav {
            background: #0d6efd;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-nav .menu-toggle {
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Dark mode */
        body.dark-mode {
            background-color: #121212;
            color: #e4e4e4;
        }

        body.dark-mode .sidebar {
            background: #1e1e1e;
        }

        body.dark-mode .top-nav {
            background: #1e1e1e;
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <div class="top-nav sticky-top">
        <span class="menu-toggle"><i class="bi bi-list"></i></span>
        <h5 class="mb-0">Admin Panel</h5>
        <button id="darkModeBtn" class="btn btn-sm btn-light">
            <i class="bi bi-moon"></i>
        </button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar p-3 fade-in" id="sidebar">
        <h4 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h4>
        <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <i class="bi bi-house-door me-2"></i> Dashboard
        </a>
        <a href="{% url 'student_list' %}">
            <i class="bi bi-people me-2"></i> Students
        </a>
        <a href="{% url 'admin_events' %}">
            <i class="bi bi-calendar-event me-2"></i> Manage Events
        </a>

        <a href="{% url 'adminpanel_announcements' %}">
    <i class="bi bi-bell me-2"></i> Announcements
</a>


        {% comment %} <li><a class="nav-link" href="{% url 'adminpanel_announcements' %}">Announcements</a></li> {% endcomment %}

        <a href="{% url 'admin_event_registrations' %}">
            <i class="bi bi-clipboard-check me-2"></i> Event Registrations
        </a>
        <a href="{% url 'admin_payments' %}">
            <i class="bi bi-cash-coin me-2"></i> Payments
        </a>
        <a href="{% url 'admin_profile' %}">
            <i class="bi bi-person-circle me-2"></i> Profile
        </a>
        <hr>
        <a href="{% url 'home' %}" class="text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
    </div>

    <!-- Main Content -->
    <div class="main-content fade-in" id="mainContent">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("mainContent");
        const toggleBtn = document.querySelector(".menu-toggle");
        const darkModeBtn = document.getElementById("darkModeBtn");
        const body = document.body;

        // Sidebar toggle
        toggleBtn.addEventListener("click", () => {
            sidebar.classList.toggle("show");
            mainContent.classList.toggle("collapsed");
        });

        // Dark mode toggle with persistence
        if (localStorage.getItem("darkMode") === "enabled") {
            body.classList.add("dark-mode");
        }

        darkModeBtn.addEventListener("click", () => {
            body.classList.toggle("dark-mode");
            localStorage.setItem("darkMode", body.classList.contains("dark-mode") ? "enabled" : "disabled");
        });
    </script>
</body>
</html>
